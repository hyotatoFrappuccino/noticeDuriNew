<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알려두리 - 회원가입</title>
    <style>
        .custom-checkbox label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #495057;
            cursor: pointer;
            position: relative;
        }

        .custom-checkbox input[type="checkbox"] {
            display: none; /* 기본 체크박스 숨김 */
        }

        .custom-checkbox .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid #adb5bd;
            border-radius: 4px;
            background-color: #f8f9fa;
            display: inline-block;
            position: relative;
            transition: all 0.2s ease;
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark {
            border-color: #228be6;
            background-color: #228be6;
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 6px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .custom-checkbox a {
            text-decoration: none;
            color: #228be6;
        }

        .custom-checkbox a:hover {
            text-decoration: underline;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #191919;
        }

        .register-container {
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            color: #191919;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-container {
            position: relative;
        }

        input, select {
            width: 100%;
            height: 50px;
            padding: 0 16px 0 46px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            background-color: #f8f9fa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #228be6;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(34, 139, 230, 0.1);
        }

        input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        .input-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 16px;
            pointer-events: none;
        }

        button {
            height: 50px;
            background-color: #228be6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        button:hover {
            background-color: #1c7ed6;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            body {
                background-color: white;
            }

            .register-container {
                padding: 24px 20px;
                box-shadow: none;
            }

            input, select, button {
                height: 48px;
            }
        }

        .feedback-message {
            font-size: 13px;
            margin-top: 8px;
            color: #e03131; /* 기본적으로 오류 색 */
        }

        .feedback-message.valid {
            color: #37b24d; /* 유효한 경우 녹색 */
        }

        .suggestions-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
            position: absolute;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
            width: calc(100% - 46px); /* 아이콘 및 패딩 고려 */
            display: none; /* 기본적으로 숨김 */
        }

        .suggestions-list li {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            color: #191919;
        }

        .suggestions-list li:hover {
            background: #f1f3f5;
        }

        .suggestions-list li.active {
            background: #e7f5ff; /* 활성화된 항목 배경 */
            color: #1c7ed6; /* 활성화된 항목 텍스트 색상 */
        }
    </style>

<!--    로그인 아이디 검증-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginIdInput = document.getElementById("loginId");
            const feedbackMessage = document.getElementById("loginIdFeedback");

            loginIdInput.addEventListener("blur", () => {
                const loginId = loginIdInput.value.trim();
                if (!loginId) {
                    feedbackMessage.textContent = "아이디를 입력해주세요.";
                    feedbackMessage.classList.remove("valid");
                    return;
                }

                // 서버에 요청 보내기
                fetch(`/users/existsLoginId?loginId=${encodeURIComponent(loginId)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("서버 응답 오류");
                        }
                        return response.json();
                    })
                    .then(isExists => {
                        if (isExists) {
                            feedbackMessage.textContent = "이미 사용 중인 아이디입니다.";
                            feedbackMessage.classList.remove("valid");
                        } else {
                            feedbackMessage.textContent = "사용 가능한 아이디입니다.";
                            feedbackMessage.classList.add("valid");
                        }
                    })
                    .catch(error => {
                        feedbackMessage.textContent = "아이디 확인 중 문제가 발생했습니다.";
                        feedbackMessage.classList.remove("valid");
                        console.error(error);
                    });
            });
        });
    </script>

<!--    이메일 추천-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const emailInput = document.getElementById("email");
            const suggestionsList = document.getElementById("emailSuggestions");

            const domains = [
                "@naver.com",
                "@daum.net",
                "@hanmail.net",
                "@kakao.com",
                "@gmail.com",
                "@nate.com",
                "@outlook.com"
            ];

            let activeIndex = -1; // 현재 활성화된 항목의 인덱스

            emailInput.addEventListener("input", () => {
                const inputValue = emailInput.value.trim();
                const [localPart, domainPart] = inputValue.split("@");

                // 전체 목록 보여주기
                const filteredDomains = domainPart
                    ? domains.filter(domain => domain.includes(domainPart)) // 필터링
                    : domains; // 도메인 전체 목록

                activeIndex = -1; // 입력 시 활성화된 항목 초기화
                renderSuggestions(filteredDomains, localPart || ""); // localPart가 없으면 빈 문자열 전달
            });

            emailInput.addEventListener("keydown", (event) => {
                const items = suggestionsList.querySelectorAll("li");

                if (event.key === "ArrowDown") {
                    // 아래 방향키
                    activeIndex = (activeIndex + 1) % items.length;
                    updateActiveItem(items);
                    event.preventDefault();
                } else if (event.key === "ArrowUp") {
                    // 위 방향키
                    activeIndex = (activeIndex - 1 + items.length) % items.length;
                    updateActiveItem(items);
                    event.preventDefault();
                } else if (event.key === "Enter") {
                    // Enter 키
                    if (activeIndex >= 0 && items[activeIndex]) {
                        emailInput.value = items[activeIndex].textContent;
                        suggestionsList.style.display = "none";
                        event.preventDefault();
                    }
                }
            });

            const renderSuggestions = (filteredDomains, localPart) => {
                if (filteredDomains.length === 0) {
                    suggestionsList.style.display = "none";
                    return;
                }

                suggestionsList.innerHTML = "";
                filteredDomains.forEach((domain, index) => {
                    const listItem = document.createElement("li");
                    listItem.textContent = `${localPart}${domain}`;
                    listItem.addEventListener("click", () => {
                        emailInput.value = listItem.textContent;
                        suggestionsList.style.display = "none";
                    });
                    suggestionsList.appendChild(listItem);
                });

                suggestionsList.style.display = "block";
            };

            const updateActiveItem = (items) => {
                items.forEach((item, index) => {
                    if (index === activeIndex) {
                        item.classList.add("active");
                        item.scrollIntoView({block: "nearest"});
                    } else {
                        item.classList.remove("active");
                    }
                });
            };

            // 포커스를 잃으면 추천 숨김
            emailInput.addEventListener("blur", () => {
                setTimeout(() => {
                    suggestionsList.style.display = "none";
                }, 200); // 클릭 이벤트 후 숨김
            });
        });
    </script>

<!--    이용약관/개인정보처리방침 미체크시 회원가입 비활성화-->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const termsCheckbox = document.getElementById("termsCheckbox");
            const privacyCheckbox = document.getElementById("privacyCheckbox");
            const submitButton = document.querySelector("button[type='submit']");

            const updateButtonState = () => {
                if (termsCheckbox.checked && privacyCheckbox.checked) {
                    submitButton.disabled = false;
                } else {
                    submitButton.disabled = true;
                }
            };

            termsCheckbox.addEventListener("change", updateButtonState);
            privacyCheckbox.addEventListener("change", updateButtonState);

            // 초기 상태 버튼 비활성화
            submitButton.disabled = true;
        });
    </script>
