<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알려두리 - 계정 찾기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #191919;
        }

        .find-account-container {
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            color: #191919;
        }

        .menu {
            display: flex;
            flex-direction: row;
            gap: 16px;
            margin-bottom: 24px;
        }

        .menu a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            padding: 6px 0;
            transition: all 0.2s ease;
        }

        .menu a.active {
            color: #228be6;
            text-decoration: underline;
        }

        .menu a:hover {
            color: #1c7ed6;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .input-container {
            position: relative;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 16px 0 46px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            background-color: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #228be6;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(34, 139, 230, 0.1);
        }

        input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        button {
            height: 50px;
            background-color: #228be6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #1c7ed6;
        }

        .result-container {
            margin-top: 24px;
            padding: 16px;
            background-color: #f1f3f5;
            border-radius: 8px;
        }

        .result-container h2 {
            font-size: 16px;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 12px;
        }

        .result-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-container ul li {
            font-size: 14px;
            color: #495057;
            margin-bottom: 8px;
        }

    </style>
</head>
<body>
<div class="find-account-container">
    <div class="menu">
        <a id="findIdTab" class="active" href="javascript:void(0);" onclick="showTab('findIdFormContainer')">아이디 찾기</a>
        <a id="findPasswordTab" href="javascript:void(0);" onclick="showTab('findPasswordFormContainer')">비밀번호 찾기</a>
    </div>
    <div id="findIdFormContainer" class="form-container active">
        <form id="findIdForm" onsubmit="findId(event)">
            <div class="input-container">
                <label>
                    <input type="email" id="email" name="email" placeholder="가입된 이메일" required>
                </label>
            </div>
            <button type="submit">아이디 찾기</button>
        </form>
    </div>
    <div id="findPasswordFormContainer" class="form-container">
        <form id="findPasswordForm" onsubmit="findPassword(event)">
            <div class="input-container">
                <label>
                    <input type="text" id="loginId" name="loginId" placeholder="가입된 아이디" required>
                </label>
            </div>
            <button type="submit">비밀번호 찾기</button>
        </form>
    </div>

    <!-- 결과 표시 -->
    <div class="result-container" id="resultContainer" style="display:none;">
        <h2 id="resultTitle">가입된 아이디</h2>
        <ul id="resultList" style="display:none;"></ul>
        <p id="noResultMessage" style="display:none;">결과 없음</p>
    </div>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.menu a').forEach(link => link.classList.remove('active'));
        document.getElementById(tabId === 'findIdFormContainer' ? 'findIdTab' : 'findPasswordTab').classList.add('active');

        document.getElementById("resultContainer").style.display = 'none'; // 결과 숨김
    }

    async function findId(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;

        try {
            const response = await fetch(`/users/findId?email=${encodeURIComponent(email)}`, {
                method: "GET"
            });

            const resultContainer = document.getElementById("resultContainer");
            const resultList = document.getElementById("resultList");
            const noResultMessage = document.getElementById("noResultMessage");

            resultList.innerHTML = '';
            noResultMessage.style.display = 'none';

            if (response.ok) {
                const loginIds = await response.json();
                resultTitle.textContent = '가입된 아이디 목록';
                if (loginIds.length > 0) {
                    loginIds.forEach(id => {
                        const li = document.createElement('li');
                        li.textContent = id;
                        resultList.appendChild(li);
                    });
                    resultList.style.display = 'block';
                } else {
                    noResultMessage.textContent = '가입된 아이디 없음';
                    noResultMessage.style.display = 'block';
                }
            } else {
                noResultMessage.textContent = '요청 실패';
                noResultMessage.style.display = 'block';
            }

            resultContainer.style.display = 'block';
        } catch (error) {
            alert("요청 중 오류가 발생했습니다.");
        }
    }

    async function findPassword(event) {
        event.preventDefault();
        const loginId = document.getElementById("loginId").value;

        try {
            const response = await fetch(`/users/findPassword?loginId=${encodeURIComponent(loginId)}`, {
                method: "GET"
            });

            const resultContainer = document.getElementById("resultContainer");
            const resultTitle = document.getElementById("resultTitle");
            const resultList = document.getElementById("resultList");
            const noResultMessage = document.getElementById("noResultMessage");

            resultList.innerHTML = '';
            noResultMessage.style.display = 'none';

            if (response.ok) {
                const result = await response.json();
                if (result.password) {
                    resultTitle.textContent = '변경된 비밀번호';
                    const li = document.createElement('li');
                    li.textContent = result.password;
                    resultList.appendChild(li);
                    resultList.style.display = 'block';
                } else {
                    noResultMessage.textContent = '해당하는 ID가 없습니다';
                    noResultMessage.style.display = 'block';
                }
            } else {
                noResultMessage.textContent = '요청 실패';
                noResultMessage.style.display = 'block';
            }

            resultContainer.style.display = 'block';
        } catch (error) {
            alert("요청 중 오류가 발생했습니다.");
        }
    }
</script>
</body>
</html>
