<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알려두리 - 계정 찾기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #191919;
        }

        .find-account-container {
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            color: #191919;
        }

        .menu {
            display: flex;
            flex-direction: row;
            gap: 16px;
            margin-bottom: 24px;
        }

        .menu a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            padding: 6px 0;
            transition: all 0.2s ease;
        }

        .menu a.active {
            color: #228be6;
            text-decoration: underline;
        }

        .menu a:hover {
            color: #1c7ed6;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .input-container {
            position: relative;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 16px 0 46px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            background-color: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #228be6;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(34, 139, 230, 0.1);
        }

        input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        button {
            height: 50px;
            background-color: #228be6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #1c7ed6;
        }

        .result-container {
            margin-top: 24px;
            padding: 16px;
            background-color: #f1f3f5;
            border-radius: 8px;
        }

        .result-container h2 {
            font-size: 16px;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 12px;
        }

        .result-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-container ul li {
            font-size: 14px;
            color: #495057;
            margin-bottom: 8px;
        }

    </style>
</head>
<body>
<div class="find-account-container">
    <h1>계정 찾기</h1>
    <div class="menu">
        <a id="findIdTab" class="active" href="javascript:void(0);" onclick="showTab('findIdFormContainer')">아이디 찾기</a>
        <a id="findPasswordTab" href="javascript:void(0);" onclick="showTab('findPasswordFormContainer')">비밀번호 찾기</a>
    </div>
    <div id="findIdFormContainer" class="form-container active">
        <form id="findIdForm" method="get" onsubmit="findId(event)">
            <div class="input-container">
                <label>
                    <input type="email" id="email" name="email" placeholder="가입된 이메일" required>
                </label>
            </div>
            <button type="button" onclick="findId(event)">아이디 찾기</button>

        </form>
    </div>
    <div id="findPasswordFormContainer" class="form-container">
        <form id="findPasswordForm" method="get" onsubmit="findPassword(event)">
            <div class="input-container">
                <label>
                    <input type="text" name="loginId" placeholder="가입된 아이디" required>
                </label>
            </div>
            <button type="submit">비밀번호 찾기</button>
        </form>
    </div>

    <!-- 아이디 목록 표시 -->
    <div class="result-container" id="resultContainer" style="display:none;">
        <h2>가입된 아이디 목록</h2>
        <ul id="loginIdList"></ul>
        <p id="noIdsMessage" style="display:none;">가입된 아이디 없음</p>
    </div>

</div>

<script>
    function showTab(tabId) {
        // 모든 폼 숨기기
        document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        // 메뉴의 활성화된 탭 변경
        document.querySelectorAll('.menu a').forEach(link => link.classList.remove('active'));
        document.getElementById(tabId === 'findIdFormContainer' ? 'findIdTab' : 'findPasswordTab').classList.add('active');

        // 비밀번호 찾기 탭일 경우 아이디 목록 숨기기
        if (tabId === 'findPasswordFormContainer') {
            const resultContainer = document.getElementById("resultContainer");
            resultContainer.style.display = 'none'; // 결과 영역 숨기기
        }
    }

    async function findId(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;

        const response = await fetch("/users/findId", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({email: email})
        });

        if (response.ok) {
            const loginIds = await response.json();
            const resultContainer = document.getElementById("resultContainer");
            const loginIdList = document.getElementById("loginIdList");
            const noIdsMessage = document.getElementById("noIdsMessage");

            // 이전 결과들 초기화
            loginIdList.innerHTML = '';
            noIdsMessage.style.display = 'none';

            if (loginIds.length > 0) {
                // 로그인 아이디 목록 표시
                loginIds.forEach(id => {
                    const li = document.createElement('li');
                    li.textContent = id;
                    loginIdList.appendChild(li);
                });
                resultContainer.style.display = 'block'; // 결과 영역 보이기
            } else {
                // 아이디 없음 메시지 표시
                noIdsMessage.style.display = 'block';
                resultContainer.style.display = 'block'; // 결과 영역 보이기
            }
        } else {
            alert("아이디를 찾을 수 없습니다.");
        }
    }

    async function findPassword(event) {
        event.preventDefault();
        const loginId = document.getElementById("findPasswordForm").loginId.value;

        // 비밀번호 찾기 시 아이디 목록을 숨김
        const resultContainer = document.getElementById("resultContainer");
        resultContainer.style.display = 'none'; // 결과 영역 숨기기

        const response = await fetch(`/users/findPassword?loginId=${encodeURIComponent(loginId)}`, {
            method: "GET",
        });

        if (response.ok) {
            const result = await response.json();
            if (result.success) {
                alert("비밀번호 찾기 성공");
            } else {
                alert("비밀번호를 찾을 수 없습니다.");
            }
        } else {
            alert("비밀번호를 찾을 수 없습니다.");
        }
    }

</script>
</body>
</html>
